[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daw-mcp-server"
version = "0.1.0"
description = "MCP server for DAW automation, rendering and verification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
daw-mcp-server = "daw_mcp.server:main"

[tool.setuptools]
packages = ["daw_mcp"]
